<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Craftverse — мини Minecraft</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="crosshair">+</div>

  <div id="hud">
    <div id="health"></div>
  </div>

  <div id="hotbar"></div>

  <div id="overlay">
    <div class="overlay__box">
      <h1>CRAFTVERSE</h1>
      <p>Мини-Minecraft прямо в браузере</p>
      <ul>
        <li><b>WASD</b> — ходьба, <b>Пробел</b> — прыжок, <b>Shift</b> — вниз/медленно</li>
        <li><b>Мышь</b> — осмотр</li>
        <li><b>ЛКМ</b> — ломать блок / бить свинку</li>
        <li><b>ПКМ</b> — поставить блок</li>
        <li><b>1–6</b> или <b>колесо</b> — выбрать блок</li>
      </ul>
      <button id="startBtn">ИГРАТЬ</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
